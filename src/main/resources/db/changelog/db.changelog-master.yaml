databaseChangeLog:
  - changeSet:
      id: 1
      author: invex
      changes:
        - createTable:
            tableName: Empleado
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: primerNombre
                  type: VARCHAR(100)
              - column:
                  name: segundoNombre
                  type: VARCHAR(100)
              - column:
                  name: apellidoPaterno
                  type: VARCHAR(100)
              - column:
                  name: apellidoMaterno
                  type: VARCHAR(100)
              - column:
                  name: edad
                  type: INT
              - column:
                  name: sexo
                  type: VARCHAR(10)
              - column:
                  name: fechaNacimiento
                  type: DATE
