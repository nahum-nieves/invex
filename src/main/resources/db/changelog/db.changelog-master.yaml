databaseChangeLog:
  - changeSet:
      id: 1
      author: arturo_nieves
      changes:
        - createTable:
            tableName: Empleado
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: primerNombre
                  type: VARCHAR(100)
              - column:
                  name: segundoNombre
                  type: VARCHAR(100)
              - column:
                  name: apellidoPaterno
                  type: VARCHAR(100)
              - column:
                  name: apellidoMaterno
                  type: VARCHAR(100)
              - column:
                  name: edad
                  type: INT
              - column:
                  name: sexo
                  type: VARCHAR(10)
              - column:
                  name: fechaNacimiento
                  type: DATE
              - column:
                  name: puesto
                  type: VARCHAR(60)
              - column:
                  name: fechaAlta
                  type: DATE
              - column:
                  name: ativo
                  type: bool
  - changeSet:
      id: 2
      author: arturo_nieves
      changes:
        - createTable:
            tableName: Usuario
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(60)
                  constraints:
                    nullable: false

  - changeSet:
        id: 3
        author: arturo_nieves
        changes:
          - insert:
                tableName: Usuario
                columns:
                    - column:
                        name: email
                        value: anahumnieves@gmail.com
                    - column:
                        name: password
                        value: $2a$10$KMgll7i73sajHecI/2yNGeiLE8tx1bMMUKqxpjlsSPE8iXSCFLKDK
  - changeSet:
      id: 4
      author: arturo_nieves
      changes:
        - renameColumn:
            tableName: Empleado
            oldColumnName: ativo
            newColumnName: activo
            columnDataType: bool